# ============================================================
# 50-psmm-web.conf
# Le serveur Web lit error.log d'Apache (imfile) et transmet
# les echecs d'authentification basic au collecteur en TCP.
# imfile permet le TCP nativement (contournement du piege UDP).
# Spool disque si le collecteur est injoignable.
# ============================================================

module(load="imfile")

input(type="imfile"
      File="/var/log/apache2/error.log"
      Tag="apache-web"
      Severity="info"
      Facility="local6")

# On ne transmet que les echecs d'auth basic (AH01618 ou AH01617)
if ($programname == 'apache-web' and ($msg contains 'AH01618' or $msg contains 'AH01617')) then {
    action(type="omfwd"
           target="10.10.13.35"
           port="6514"
           StreamDriver="gtls"
           StreamDriverMode="1"
           StreamDriverAuthMode="x509/name"
           StreamDriverPermittedPeers="pokemon-mariadb"
           protocol="tcp"
           action.resumeRetryCount="-1"
           queue.type="linkedList"
           queue.filename="q_web_spool"
           queue.saveOnShutdown="on"
           queue.maxDiskSpace="50m")
}
