# ============================================================
# 50-psmm-ftp.conf
# Le serveur FTP lit son log vsftpd (imfile) et transmet
# les echecs de connexion au collecteur en TCP (omfwd).
# Spool disque si le collecteur est injoignable (aucune perte).
# ============================================================

# --- Lecture du fichier de log vsftpd (module imfile) ---
module(load="imfile")

input(type="imfile"
      File="/var/log/vsftpd.log"
      Tag="vsftpd-ftp"
      Severity="info"
      Facility="local5")

# --- Envoi au collecteur en TCP, avec spool disque ---
# On ne transmet que les lignes d'echec de connexion (FAIL LOGIN).
if ($programname == 'vsftpd-ftp' and $msg contains 'FAIL LOGIN') then {
    action(type="omfwd"
           target="10.10.13.35"
           port="6514"
           StreamDriver="gtls"
           StreamDriverMode="1"
           StreamDriverAuthMode="x509/name"
           StreamDriverPermittedPeers="pokemon-mariadb"
           protocol="tcp"
           action.resumeRetryCount="-1"
           queue.type="linkedList"
           queue.filename="q_ftp_spool"
           queue.saveOnShutdown="on"
           queue.maxDiskSpace="50m")
}
