#!/usr/sbin/nft -f
# Restreint l'acces au port 6514 (collecteur rsyslog TLS)
# aux seules IP des serveurs FTP et Web.

table inet psmm_filter {
    chain input {
        type filter hook input priority 0; policy accept;

        # Autoriser 6514 depuis le FTP et le Web
        ip saddr { 10.10.13.37, 10.10.13.36 } tcp dport 6514 accept

        # Rejeter toute autre tentative sur 6514
        tcp dport 6514 drop
    }
}
