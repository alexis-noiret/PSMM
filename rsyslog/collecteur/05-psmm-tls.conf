# ============================================================
# 05-psmm-tls.conf - Configuration TLS mutuel (mTLS) du collecteur
# Les logs syslog circulent chiffres. Le collecteur verifie
# le certificat des serveurs (ftp/web) via la CA (mTLS).
# ============================================================

# Driver TLS gnutls
global(
    defaultNetstreamDriver="gtls"
    defaultNetstreamDriverCAFile="/etc/rsyslog-tls/ca-cert.pem"
    defaultNetstreamDriverCertFile="/etc/rsyslog-tls/mariadb-cert.pem"
    defaultNetstreamDriverKeyFile="/etc/rsyslog-tls/mariadb-key.pem"
)
