# ============================================================
# 10-psmm-central.conf
# Collecteur central rsyslog (ecoute TCP 514) + ecriture des
# tentatives d'acces (SQL, FTP) dans psmm.acces_errors.
# ============================================================

# --- Job 16 : ecoute TCP 514 ---
module(load="imtcp")
input(type="imtcp" port="6514" streamDriver.mode="1" streamDriver.authMode="x509/name" permittedPeer=["pokemon-ftp","pokemon-web"])

module(load="ommysql")

# ============================================================
# Job 17 : Access denied MariaDB -> base
# ============================================================
template(name="tpl_sql_mariadb" type="string"
 string="INSERT INTO acces_errors (service,serveur,compte,ip,date_heure,message) VALUES ('SQL','%hostname%','%$.compte%','%$.ip%','%timereported:::date-mysql%','%msg%')" option.sql="on")

if ($programname startswith 'mariadb' and $msg contains 'Access denied for user') then {
    set $.compte = re_extract($msg, "user '([^']+)'", 0, 1, "inconnu");
    set $.ip = re_extract($msg, "@'([^']+)'", 0, 1, "inconnu");
    action(type="ommysql" server="localhost" db="psmm" uid="rsyslog" pwd="VOTRE_MDP_RSYSLOG" template="tpl_sql_mariadb")
}

# ============================================================
# Job 18 : echecs FTP -> base
# ============================================================
template(name="tpl_sql_ftp" type="string"
 string="INSERT INTO acces_errors (service,serveur,compte,ip,date_heure,message) VALUES ('FTP','pokemon-ftp','%$.compte%','%$.ip%','%timereported:::date-mysql%','%msg%')" option.sql="on")

if ($programname == 'vsftpd-ftp' and $msg contains 'FAIL LOGIN') then {
    set $.compte = re_extract($msg, "\\] \\[([^]]+)\\] FAIL", 0, 1, "inconnu");
    set $.ip = re_extract($msg, "Client \"([^\"]+)\"", 0, 1, "inconnu");
    action(type="ommysql" server="localhost" db="psmm" uid="rsyslog" pwd="VOTRE_MDP_RSYSLOG" template="tpl_sql_ftp")
}

# ============================================================
# Job 19 : echecs auth Apache (web) -> base
# compte apres "user " (sans le ':' eventuel) ; IP dans [client IP:port]
# ============================================================
template(name="tpl_sql_web" type="string"
 string="INSERT INTO acces_errors (service,serveur,compte,ip,date_heure,message) VALUES ('Web','pokemon-web','%$.compte%','%$.ip%','%timereported:::date-mysql%','%msg%')" option.sql="on")

if ($programname == 'apache-web' and ($msg contains 'AH01618' or $msg contains 'AH01617')) then {
    set $.compte = re_extract($msg, "user ([^ :]+)", 0, 1, "inconnu");
    set $.ip = re_extract($msg, "\\[client ([^]:]+)", 0, 1, "inconnu");
    action(type="ommysql" server="localhost" db="psmm" uid="rsyslog" pwd="VOTRE_MDP_RSYSLOG" template="tpl_sql_web")
}
